    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {
          // ignore if redefine is not supported
        }

        // Suppress unhandled extension errors from interfering with the application
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            var source = (event && event.filename) || (event && event.error && event.error.stack) || '';
            if (
              source.indexOf('chrome-extension://') !== -1 ||
              source.indexOf('moz-extension://') !== -1 ||
              source.indexOf('safari-extension://') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var stack = (reason && reason.stack) || (typeof reason === 'string' ? reason : '');
            if (
              stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('moz-extension://') !== -1 ||
              stack.indexOf('safari-extension://') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);
        }
      })();
